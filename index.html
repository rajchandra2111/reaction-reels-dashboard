<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob: data:; connect-src https://api.github.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131312" media="(prefers-color-scheme: dark)">
<title>Reaction Reels</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='8' y='2' width='16' height='28' rx='4' fill='%23131312'/%3E%3Crect x='10' y='5' width='12' height='10.5' rx='1.5' fill='%23ef6a4c'/%3E%3Crect x='10' y='16.5' width='12' height='10.5' rx='1.5' fill='%237b6cf0'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f4f0;--surface:#fff;--surface-2:#faf9f6;--border:#e6e3dc;--border-strong:#d3cfc5;
  --text:#1b1a18;--muted:#6b6861;--faint:#9b978f;
  --accent:#5a48dc;--accent-ink:#fff;--accent-soft:#eceafd;--focus:#7b6cf0;
  --content:#ef6a4c;--reaction:#7b6cf0;
  --ok:#1d8a4b;--ok-soft:#e2f3e9;--bad:#cf3a3a;--bad-soft:#fbe8e8;--warn:#a86d12;--warn-soft:#fbf1dd;--run:#2c68dc;--run-soft:#e5edfc;
  --used:#efb3a4;--free:#cfe9d9;
  --radius:16px;--radius-sm:10px;
  --shadow:0 1px 2px rgba(25,20,10,.05),0 4px 14px rgba(25,20,10,.04);
  --font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131312;--surface:#1c1c1a;--surface-2:#20201e;--border:#2e2d2a;--border-strong:#3d3c38;
  --text:#ecebe7;--muted:#a3a098;--faint:#76736c;
  --accent:#8b7ef5;--accent-ink:#141218;--accent-soft:#2a2645;--focus:#9d92f7;
  --ok:#47c07a;--ok-soft:#173523;--bad:#f06a6a;--bad-soft:#3d1c1c;--warn:#e0a648;--warn-soft:#3a2c14;--run:#6f9bf4;--run-soft:#1b2843;
  --used:#7b3d30;--free:#1f4430;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#131312;--surface:#1c1c1a;--surface-2:#20201e;--border:#2e2d2a;--border-strong:#3d3c38;
  --text:#ecebe7;--muted:#a3a098;--faint:#76736c;
  --accent:#8b7ef5;--accent-ink:#141218;--accent-soft:#2a2645;--focus:#9d92f7;
  --ok:#47c07a;--ok-soft:#173523;--bad:#f06a6a;--bad-soft:#3d1c1c;--warn:#e0a648;--warn-soft:#3a2c14;--run:#6f9bf4;--run-soft:#1b2843;
  --used:#7b3d30;--free:#1f4430;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}.tiny{font-size:12px}
.mono{font-family:var(--mono);font-size:13px}.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.stack>*+*{margin-top:12px}.between{justify-content:space-between}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.fill{fill:currentColor;stroke:none}

/* ---- shell */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);border-bottom:1px solid var(--border);padding:0 max(16px,env(safe-area-inset-left))}
.topbar-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;height:58px}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:-.01em;font-size:16px;white-space:nowrap}
.mark{width:18px;height:30px;border-radius:5px;background:var(--text);padding:3px;display:grid;grid-template-rows:1fr 1fr;gap:2px;flex:none}
.mark i{display:block;border-radius:2px;background:var(--content)}.mark i+i{background:var(--reaction)}
.chip{text-decoration:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--muted);background:var(--surface);max-width:260px}
.fresh{font-size:12.5px;color:var(--muted);white-space:nowrap}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid transparent;background:transparent;display:inline-grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn:hover{background:var(--surface);border-color:var(--border);color:var(--text)}
.tabs{max-width:1120px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 max(16px,env(safe-area-inset-left))}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:12px 12px 11px;cursor:pointer;color:var(--muted);font-weight:550;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--text)}.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.navwrap{border-bottom:1px solid var(--border);background:var(--bg)}
main,.live-wrap{max-width:1120px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left)) 0}
main{padding-bottom:64px}
h1,h2,h3{margin:0;letter-spacing:-.015em}
h2{font-size:17px;font-weight:650}h3{font-size:15px;font-weight:650}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 12px}
.section-head:first-child{margin-top:4px}

/* ---- cards, stats */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.stat .label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .value{font-size:22px;font-weight:650;letter-spacing:-.02em;margin-top:6px;line-height:1.25}
.stat .sub{font-size:13px;color:var(--muted);margin-top:4px}
.meter{height:6px;border-radius:999px;background:var(--border);overflow:hidden;margin-top:12px}
.meter>i{display:block;height:100%;border-radius:999px;background:var(--ok)}
.meter.warn>i{background:var(--warn)}.meter.bad>i{background:var(--bad)}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px 14px;font-size:14px;border:1px solid}
.banner.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent);color:var(--text)}
.banner.warn svg{color:var(--warn);margin-top:2px}
.banner.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.banner.bad svg{color:var(--bad);margin-top:2px}
.banner.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.banner.info svg{color:var(--accent);margin-top:2px}

/* ---- pills & buttons */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px 2px 8px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.run{background:var(--run-soft);color:var(--run)}.pill.run::before{animation:pulse 1.2s infinite}
.pill.idle{background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
@keyframes pulse{50%{opacity:.35}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--surface);padding:9px 14px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;min-height:40px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}.btn.ghost:hover{color:var(--text);background:var(--surface-2)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13.5px}
.btn[disabled]{opacity:.55;cursor:not-allowed;filter:none}
.link{display:inline-flex;align-items:center;gap:5px;color:var(--accent);text-decoration:none;font-weight:600;font-size:13.5px}
.link:hover{text-decoration:underline}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(1turn)}}
@media (prefers-reduced-motion:reduce){.spin,.pill.run::before{animation:none}}

/* ---- forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-size:13px;font-weight:600}
.field .hint{font-size:12.5px;color:var(--muted)}
.field .err{font-size:12.5px;color:var(--bad);font-weight:550}
.field .okmsg{font-size:12.5px;color:var(--ok);font-weight:550}
.input,select.input{width:100%;border:1px solid var(--border-strong);background:var(--surface);border-radius:var(--radius-sm);padding:9px 11px;min-height:40px}
.input:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 22%,transparent)}
.input.bad{border-color:var(--bad)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;user-select:none}
.switch input{appearance:none;width:38px;height:22px;border-radius:999px;background:var(--border-strong);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked{background:var(--accent)}.switch input:checked::after{transform:translateX(16px)}
.seg{display:flex;width:100%;border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:3px;background:var(--surface-2);gap:3px}
.seg button{flex:1;white-space:nowrap;border:0;background:transparent;border-radius:7px;padding:6px 11px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.range{display:flex;align-items:center;gap:10px}.range input{flex:1;accent-color:var(--accent)}
.range output{min-width:46px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
details.adv>summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:13.5px;list-style:none;display:flex;align-items:center;gap:6px}
details.adv>summary::-webkit-details-marker{display:none}
details.adv[open]>summary svg,svg.i.rot{transform:rotate(180deg)}

/* ---- reels */
.reels{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.reel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.thumb{aspect-ratio:9/16;background:linear-gradient(var(--content) 0 50%,var(--reaction) 50% 100%);opacity:.9;position:relative;display:grid;place-items:center;color:#fff}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .badge{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11.5px;font-weight:650;border-radius:6px;padding:2px 7px}
.reel .meta{padding:11px 12px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.reel .name{font-weight:650;font-size:14px}
.empty{border:1px dashed var(--border-strong);border-radius:var(--radius);padding:28px 18px;text-align:center;color:var(--muted)}
.empty h3{color:var(--text);margin-bottom:6px}

/* ---- timeline */
.tl{position:relative;height:34px;border-radius:9px;background:var(--surface-2);border:1px solid var(--border-strong);overflow:hidden;cursor:crosshair}
.tl.mini{height:10px;border-radius:999px;cursor:default}
.tl .used{position:absolute;top:0;bottom:0;background:var(--used)}
.tl .sel{position:absolute;top:3px;bottom:3px;border-radius:6px;background:color-mix(in srgb,var(--accent) 35%,transparent);border:2px solid var(--accent)}
.tl .sel.bad{background:color-mix(in srgb,var(--bad) 30%,transparent);border-color:var(--bad)}
.tl-scale{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-top:4px;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ---- lists */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border);min-width:0}
.item:first-child{border-top:0}
.item .t{font-weight:600;font-size:14px}
.badge-n{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12.5px;padding:0 6px}
.mini-thumb{width:34px;height:60px;border-radius:6px;overflow:hidden;flex:none;background:linear-gradient(var(--content) 0 50%,var(--reaction) 50% 100%);position:relative}
.mini-thumb img{width:100%;height:100%;object-fit:cover;display:block}

/* ---- live run */
.live{border:1px solid color-mix(in srgb,var(--run) 35%,var(--border));background:linear-gradient(180deg,var(--run-soft),var(--surface) 70%)}
.live.ok{border-color:color-mix(in srgb,var(--ok) 35%,var(--border));background:linear-gradient(180deg,var(--ok-soft),var(--surface) 70%)}
.live.bad{border-color:color-mix(in srgb,var(--bad) 35%,var(--border));background:linear-gradient(180deg,var(--bad-soft),var(--surface) 70%)}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 18px;margin-top:12px}
.step{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.step.active{color:var(--text);font-weight:600}.step.done{color:var(--text)}
.step .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--border-strong);flex:none;display:grid;place-items:center}
.step.done .dot{border:0;background:var(--ok);color:#fff}.step.failed .dot{border:0;background:var(--bad);color:#fff}
.step.active .dot{border-color:var(--run);border-right-color:transparent;animation:spin .8s linear infinite}
.step .dot svg{width:11px;height:11px;stroke-width:3}
.annot{font-size:13.5px;margin-top:10px;display:flex;gap:8px;align-items:flex-start}
.annot svg{margin-top:2px}

/* ---- connect */
.connect{max-width:520px;margin:6vh auto 40px;padding:0 16px}
.connect .card{padding:26px}
.connect h1{font-size:24px;margin:16px 0 6px}
.steps-list{margin:14px 0 0;padding-left:20px;color:var(--muted);font-size:14px}
.steps-list li+li{margin-top:6px}

/* ---- toast */
#toasts{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,460px);pointer-events:none}
.toast{pointer-events:auto;background:var(--text);color:var(--bg);border-radius:12px;padding:11px 15px;font-size:14px;font-weight:550;box-shadow:0 6px 24px rgba(0,0,0,.18);display:flex;gap:10px;align-items:center}
.toast.bad{background:var(--bad);color:#fff}

@media (max-width:640px){
  .stats{grid-template-columns:1fr 1fr;gap:10px}
  .stat{padding:14px}.stat .value{font-size:18px}
  .hide-sm{display:none!important}
  .reels{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card{padding:15px}
  .chip{display:none}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts" role="status" aria-live="polite"></div>

const TASK_LABEL = { 'make-reels': 'Make reels', 'custom-reel': 'Custom reel', 'refresh-status': 'Refresh status', 'check-setup': 'Check setup' };
async function dispatch(task, inputs) {

    if (typeof v === 'boolean') clean[k] = v ? 'true' : 'false';
    else if (v != null && String(v).trim() !== '') clean[k] = String(v).trim();
  }
  const body = { ref: S.repo.default_branch, inputs: clean, return_run_details: true };
  const path = `${repoPath()}/actions/workflows/${WORKFLOW}/dispatches`;
  const t0 = Date.now();
  let res;

  catch (e) {
    if (e.status === 422 && /return_run_details/i.test(e.message)) { delete body.return_run_details; res = await gh(path, { method: 'POST', body }); }

    else throw e;
  }
  const runId = res && (res.workflow_run_id || res.run_id || (res.workflow_run && res.workflow_run.id) || null);
  S.live = { task, label: TASK_LABEL[task] || task, inputs: clean, t0, runId, run: null, jobs: [], done: false, annots: [] };
  toast(`${S.live.label} started`);

  schedulePoll();
}
async function pollLive() {

    const found = (j.workflow_runs || []).find(r => new Date(r.created_at).getTime() >= L.t0 - 15000);
    if (found) L.runId = found.id;
    else if (Date.now() - L.t0 > 180000) {

      renderLive(); return;
    } else { renderLive(); return; }
  }
  L.run = await gh(`${repoPath()}/actions/runs/${L.runId}`);
  L.jobs = await jobsFor(L.runId, true).catch(() => L.jobs);
  if (L.run.status === 'completed') {
    L.done = true;
    L.annots = await annotationsFor(L.run);
    await Promise.all([loadRuns(), loadStatus()]).catch(() => {});
    S.seenCompleted = L.run.id;
    const ok = L.run.conclusion === 'success';
    toast(ok ? `${L.label} finished` : `${L.label} ${L.run.conclusion === 'cancelled' ? 'was cancelled' : 'failed'}`, !ok);
    renderView();
  }
  renderLive();
}

    view.append(h('div', { style: { marginTop: '14px' } }, body));
  }
  view.append(connectionCard());
  const bar = h('div', { id: 'savebar', class: 'card', style: { position: 'sticky', bottom: '12px', marginTop: '16px', display: 'none', alignItems: 'center', gap: '12px', flexWrap: 'wrap', zIndex: 5 } },
    h('span', { id: 'save-count', class: 'grow', style: { fontWeight: 600 } }),
    h('button', { class: 'btn ghost', onclick: () => { S.edits = {}; renderView(true); } }, 'Discard'),
    h('button', { class: 'btn primary', id: 'save-btn', onclick: async e => {
      const b = e.currentTarget; b.disabled = true; b.replaceChildren(h('span', { class: 'spin' }), 'Saving…');
      try {
        const keys = Object.keys(S.edits);
        await saveConfig(S.edits, `Dashboard: update ${keys.map(k => k.split('.')[1]).slice(0, 4).join(', ')}${keys.length > 4 ? '…' : ''}`);
        S.edits = {}; toast('Settings saved - used from the next run'); document.activeElement && document.activeElement.blur(); renderView(true);
      } catch (err) { onError(err); b.disabled = false; b.replaceChildren('Save changes'); }
    } }, 'Save changes'));
  view.append(bar);
  updateSaveBar();
}
function scheduleCard() {
  const sc = S.sched;
  if (!S.schedEdit) S.schedEdit = { time: sc ? `${pad(sc.hour)}:${pad(sc.minute)}` : '06:23', paused: S.cfgValues['run.paused'] === true };
  const E = S.schedEdit;
  const tzName = sc ? sc.tz : 'Europe/Amsterdam';
  const msg = h('div', { class: 'hint' });
  const next = nextRunAt(sc);
  msg.textContent = !sc ? 'Could not read the schedule from daily.yml.' : `Next run: ${next ? fmtWhen(next) : '–'}. GitHub can start scheduled runs 5–30 minutes late.`;
  const save = h('button', { class: 'btn primary', onclick: async () => {
    const [hh, mm] = E.time.split(':').map(Number);
    if (!(hh >= 0 && hh < 24 && mm >= 0 && mm < 60)) { toast('Pick a valid time', true); return; }
    save.disabled = true; save.replaceChildren(h('span', { class: 'spin' }), 'Saving…');
    try {
      const changedTime = sc && (hh !== sc.hour || mm !== sc.minute);
      const changedPause = E.paused !== (S.cfgValues['run.paused'] === true);
      if (!changedTime && !changedPause) { toast('Nothing to change'); return; }
      if (changedPause) await saveConfig({ 'run.paused': E.paused }, E.paused ? 'Dashboard: pause daily reels' : 'Dashboard: resume daily reels');
      if (changedTime) {
        const text = setSchedule(S.wf, hh, mm, tzName);
        try { await putFile(`.github/workflows/${WORKFLOW}`, text, S.wfSha, `Dashboard: daily reels at ${E.time} ${tzName}`); }
        catch (e) {
          if (e.status === 403 || e.status === 404 || e.status === 422) throw new ApiError('Changing the time needs a token with the Workflows: Read and write permission.', e.status);
          if (e.status === 409) { await loadWorkflow(); throw new ApiError('The workflow changed meanwhile - reloaded. Try again.', 409); }
          throw e;
        }
        await loadWorkflow();
      }
      toast(changedTime ? `Daily reels now at ${E.time}` : E.paused ? 'Daily reels paused' : 'Daily reels resumed');
      S.schedEdit = null; document.activeElement && document.activeElement.blur(); renderView(true);
    } catch (err) { onError(err); }
    finally { save.disabled = false; save.replaceChildren('Save schedule'); }
  } }, 'Save schedule');
  return h('div', { class: 'card' },
    h('div', { style: { marginBottom: '14px' } }, h('h2', null, 'Schedule'), h('div', { class: 'small muted' }, 'When the automatic daily run happens.')),
    h('div', { class: 'form-grid' },
      h('div', { class: 'field' }, h('label', { for: 's-time' }, `Daily at (${tzName.replace('_', ' ')})`),
        h('input', { class: 'input num', id: 's-time', type: 'time', value: E.time, oninput: e => { E.time = e.target.value; } })),
      h('div', { class: 'field', style: { justifyContent: 'flex-end' } },
        h('label', { class: 'switch' }, h('input', { type: 'checkbox', checked: E.paused, onchange: e => { E.paused = e.target.checked; } }), 'Pause daily reels'),
        h('div', { class: 'hint' }, 'Manual jobs from this page still work.'))),
    h('div', { style: { marginTop: '12px' } }, msg),
    h('div', { class: 'row', style: { marginTop: '14px' } }, save));
}
function connectionCard() {
  const tok = S.conn.token;
  const kind = tok.startsWith('github_pat_') ? 'Fine-grained token' : tok.startsWith('ghp_') ? 'Classic token (consider a fine-grained one)' : 'Token';
  return h('div', { class: 'card', style: { marginTop: '14px' } },
    h('div', { style: { marginBottom: '12px' } }, h('h2', null, 'Connection')),
    h('div', { class: 'list' },
      h('div', { class: 'item' }, icon('github'), h('div', { class: 'grow' }, h('div', { class: 't' }, S.repo.full_name), h('div', { class: 'small muted' }, `${S.repo.private ? 'Private' : 'Public'} · branch ${S.repo.default_branch}`))),
      h('div', { class: 'item' }, icon('key'), h('div', { class: 'grow' }, h('div', { class: 't' }, kind), h('div', { class: 'small muted mono' }, tok.slice(0, 15) + '…' + tok.slice(-4))),
        h('a', { class: 'btn sm', href: 'https://github.com/settings/personal-access-tokens', target: '_blank', rel: 'noopener noreferrer' }, 'Manage', icon('ext')))),
    h('div', { class: 'row', style: { marginTop: '12px' } },
      h('button', { class: 'btn', onclick: () => { if (confirm('Disconnect and forget the token on this device?')) { clearConn(); S.conn = null; S.repo = null; renderConnect(); } } }, icon('out'), 'Disconnect')));
}

/* ====================================================================== start */
(async function start() {
  const conn = loadConn();
  if (!conn) { renderConnect(); return; }
  try { await connect(conn); }
  catch (e) { renderConnect(e.message); }
})();
</script>
</body>
